
name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      # GitHubリポジトリのソースコードを取得
      - name: Checkout
        uses: actions/checkout@v6

      # Flutter環境を構築
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Xcode 26.3を使用
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      # Flutterの依存パッケージを取得
      - name: Install dependencies
        run: flutter pub get

      # iOSアプリを署名なしでビルド
      - name: Build iOS
        run: flutter build ios --release --no-codesign

      # Runner.appをIPA形式にパッケージング
      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/ios/iphoneos/Runner.app"

          test -d "$APP_PATH"

          mkdir -p Payload
          ditto "$APP_PATH" "Payload/Runner.app"
          ditto -c -k --sequesterRsrc --keepParent Payload app-unsigned.ipa

          test -f app-unsigned.ipa

      # IPAをGitHubに保存
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: app-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
